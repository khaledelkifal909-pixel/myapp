name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: ArtemSBulgakov/buildozer-action@v1
        with:
          workdir:.
          buildozer_version: stable
      - uses: actions/upload-artifact@v4
        with:
          name: apk-file
          path: bin/*.apk
